<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>異界オークション</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Noto+Sans+JP:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Michroma&display=swap">
<style>
@font-face{font-family:"Melete";src:url("fonts/Melete-Regular.otf") format("opentype");font-display:swap}
/* Layout: 16:9モニター1画面。左に常時監視カメラ、右に競売台。下に落札記録の帯。黒地＋蛍光オレンジ（未来救出局と同じ系譜） */
:root{
  --bk:#0a0a0a; --line:#2b2b2b; --fg:#f1f1f1; --mute:#8c8c8c; --or:#ff5c00; --or-dim:#7a2c00;
  --f-disp:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --u:min(1vw,1.78vh);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bk);color:var(--fg);height:100%;margin:0}
body{font-family:var(--f-body);font-size:clamp(14px,calc(var(--u)*1.05),22px);line-height:1.7;overflow:hidden}
button{font:inherit;color:inherit}
.wrap{position:relative;z-index:1;max-width:min(96vw,170vh);margin:0 auto;height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:calc(var(--u)*1.3);
  padding-block:calc(var(--u)*1.1) calc(var(--u)*1.3);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ヘッダー */
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--or);padding-bottom:calc(var(--u)*.7)}
.logo{font-family:var(--f-disp);font-weight:900;font-size:clamp(22px,calc(var(--u)*1.9),42px);line-height:1;letter-spacing:.04em;white-space:nowrap}
.logo em{font-style:normal;color:var(--or)}
.hr{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lbl{font-family:var(--f-mono);font-size:clamp(11px,calc(var(--u)*.72),16px);letter-spacing:.14em;color:var(--or);text-transform:uppercase}
.lbl.mute,.mute{color:var(--mute)}
.lbl.alert{animation:blink 1.6s steps(2) infinite}
.snd{font-family:var(--f-mono);font-size:clamp(11px,calc(var(--u)*.68),15px);letter-spacing:.12em;color:var(--mute);background:transparent;border:1px solid var(--line);padding:.35em .7em;cursor:pointer}
.snd[aria-pressed="true"]{color:#000;background:var(--or);border-color:var(--or)}
.snd:focus-visible,.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* 本体 */
main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:calc(var(--u)*3);align-items:center;min-height:0}
.camcol{display:flex;flex-direction:column;gap:calc(var(--u)*.8);min-width:0}

/* カメラHUD：画面の一部として常に開いている */
.hud-cam{position:relative;height:min(68vh,calc(var(--u)*42));width:auto;aspect-ratio:4/3;max-width:100%;background:#000;overflow:hidden;border:1px solid rgba(255,92,0,.35);transition:border-color .3s,box-shadow .3s}
.hud-cam video,.hud-cam .freeze{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hud-cam video{filter:grayscale(.35) contrast(1.08) saturate(.8)}
.hud-cam .freeze{filter:grayscale(1) contrast(1.2);mix-blend-mode:normal;opacity:0;transition:opacity .2s}
.hud-cam.seized .freeze{opacity:1}
.hud-cam .tint{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65));pointer-events:none}
.hud-cam .orwash{position:absolute;inset:0;background:var(--or);mix-blend-mode:multiply;opacity:0;transition:opacity .3s;pointer-events:none}
.hud-cam.seized .orwash{opacity:1}
.br{position:absolute;width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);border:2px solid var(--or)}
.b1{top:12px;left:12px;border-right:0;border-bottom:0}.b2{top:12px;right:12px;border-left:0;border-bottom:0}
.b3{bottom:12px;left:12px;border-right:0;border-top:0}.b4{bottom:12px;right:12px;border-left:0;border-top:0}
.reticle{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid rgba(255,92,0,.55);border-radius:50%;transition:width .5s cubic-bezier(.2,1.4,.4,1),border-color .3s}
.reticle::before,.reticle::after{content:"";position:absolute;background:var(--or)}
.reticle::before{left:50%;top:-12px;bottom:-12px;width:1px}
.reticle::after{top:50%;left:-12px;right:-12px;height:1px}
.reticle i{position:absolute;inset:14%;border:1px dashed rgba(255,92,0,.45);border-radius:50%;animation:spin 9s linear infinite}
.hud-cam.lock{border-color:var(--or);box-shadow:0 0 40px rgba(255,92,0,.35)}
.hud-cam.lock .reticle{width:22%;border-color:var(--or);border-width:2px}
.hud-cam.lock .reticle i{animation-duration:1.2s;border-color:var(--or)}
.scan{position:absolute;left:0;right:0;height:2px;background:var(--or);box-shadow:0 0 14px var(--or);opacity:.6;animation:scan 2.6s ease-in-out infinite alternate}
.hud-cam.seized .scan,.hud-cam.seized .reticle{display:none}
.hud-txt{position:absolute;font-family:var(--f-mono);font-size:clamp(10px,calc(var(--u)*.75),16px);letter-spacing:.1em;color:var(--or);text-shadow:0 0 6px rgba(0,0,0,.9);font-variant-numeric:tabular-nums;white-space:pre;line-height:1.5}
.ht1{top:16px;left:calc(var(--u)*3.6)}.ht2{top:16px;right:calc(var(--u)*3.6);text-align:right}
.ht3{bottom:16px;left:calc(var(--u)*3.6)}.ht4{bottom:16px;right:calc(var(--u)*3.6);text-align:right}
.seizetag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-6deg);font-family:var(--f-disp);font-weight:900;font-size:clamp(28px,calc(var(--u)*4.4),90px);color:#000;background:var(--or);padding:.05em .5em;letter-spacing:.08em;opacity:0;white-space:nowrap}
.hud-cam.seized .seizetag{animation:pop .45s cubic-bezier(.2,1.5,.4,1) both .1s}
.nocam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:0 14%;color:var(--mute);font-size:clamp(13px,calc(var(--u)*1),22px)}
.camnote{display:flex;justify-content:space-between;gap:12px;font-size:clamp(12px,calc(var(--u)*.8),17px)}
.camnote b{font-family:var(--f-disp);font-weight:900;color:var(--fg)}

/* 競売台 */
.stage{position:relative;display:flex;flex-direction:column;gap:calc(var(--u)*1.3);min-width:0;min-height:0;max-height:100%;justify-content:center;animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.idle-h{font-family:var(--f-disp);font-weight:900;font-size:clamp(26px,calc(var(--u)*3.3),70px);line-height:1.35;margin:0;text-wrap:balance}
.idle-h em{font-style:normal;color:var(--or)}
.idle-sub{margin:0;color:var(--mute);font-size:clamp(14px,calc(var(--u)*1.2),26px);max-width:30em}
.venue{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:calc(var(--u)*.8) 0}
.venue dt{font-family:var(--f-mono);font-size:clamp(10px,calc(var(--u)*.7),15px);color:var(--mute);letter-spacing:.12em;padding-top:.3em}
.venue dd{margin:0;font-size:clamp(14px,calc(var(--u)*1.1),24px)}
.venue dd b{font-family:var(--f-disp);font-weight:900}

.lothead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.item{font-family:var(--f-disp);font-weight:900;font-size:clamp(24px,calc(var(--u)*2.8),60px);line-height:1.3;margin:0;text-wrap:balance}
.appr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:calc(var(--u)*1.2);align-items:start;border-left:3px solid var(--or);padding-left:calc(var(--u)*1.2)}
.appr p{margin:0;font-size:clamp(14px,calc(var(--u)*1.15),24px)}
.thumb{width:clamp(56px,calc(var(--u)*6),130px);aspect-ratio:1;background:var(--or);overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.15);mix-blend-mode:multiply}
.price{display:flex;align-items:baseline;gap:.3em;border-top:2px solid var(--or);padding-top:calc(var(--u)*.6)}
.price b{font-family:var(--f-mono);font-weight:700;font-size:clamp(40px,calc(var(--u)*5.4),120px);line-height:1;color:var(--or);font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(255,92,0,.35)}
.price span{font-family:var(--f-disp);font-weight:900;font-size:clamp(18px,calc(var(--u)*2),44px);color:var(--or)}
.price small{margin-left:auto;font-family:var(--f-mono);font-size:clamp(10px,calc(var(--u)*.72),16px);color:var(--mute);letter-spacing:.12em}
.feed{display:flex;flex-direction:column;gap:calc(var(--u)*.5);min-height:0}
/* 入札者と、いま話している人 */
.bidders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*.8)}
.bdr{border:1px solid var(--line);padding:calc(var(--u)*.6) calc(var(--u)*.8);display:flex;flex-direction:column;gap:2px;min-width:0;transition:border-color .25s,background .25s,opacity .25s}
.bdr b{font-family:var(--f-disp);font-weight:900;font-size:clamp(13px,calc(var(--u)*1.15),26px);line-height:1.35}
.bdr.hide{visibility:hidden}
.bdr.arrive{animation:arrive .8s ease-out}
@keyframes arrive{0%{background:var(--or)}100%{background:rgba(255,92,0,.1)}}
/* 入札者の登場ポップアップ */
.intro{position:absolute;inset:-8px;z-index:5;display:grid;place-items:center;background:rgba(10,10,10,.9)}
.icard{border:2px solid var(--or);background:var(--bk);padding:calc(var(--u)*2) calc(var(--u)*2.6);display:grid;gap:calc(var(--u)*.7);width:min(100%,calc(var(--u)*44));box-shadow:0 0 60px rgba(255,92,0,.25);animation:pop .45s cubic-bezier(.2,1.5,.4,1) both;transform-origin:center}
.icard b{font-family:var(--f-disp);font-weight:900;font-size:clamp(30px,calc(var(--u)*4.4),96px);line-height:1.25;color:var(--or);text-wrap:balance}
.icard p{margin:0;font-size:clamp(16px,calc(var(--u)*1.8),40px);line-height:1.5}
/* 場面ごとの大きな表示 */
.reveal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:calc(var(--u)*2);align-items:center}
.reveal .thumb{width:clamp(110px,calc(var(--u)*15),320px)}
.big-item{font-family:var(--f-disp);font-weight:900;font-size:clamp(30px,calc(var(--u)*4.4),96px);line-height:1.25;margin:0;text-wrap:balance}
.big-sub{margin:0;font-family:var(--f-disp);font-weight:700;font-size:clamp(18px,calc(var(--u)*2.2),48px);line-height:1.5;text-wrap:balance;border-left:4px solid var(--or);padding-left:calc(var(--u)*1.4)}
.mini{display:flex;align-items:center;gap:calc(var(--u)*1)}
.mini .thumb{width:clamp(40px,calc(var(--u)*4),90px)}
.mini b{font-family:var(--f-disp);font-weight:900;font-size:clamp(16px,calc(var(--u)*1.7),36px)}
.won-price{font-family:var(--f-mono);font-weight:700;font-size:clamp(48px,calc(var(--u)*7.5),170px);line-height:1;color:var(--or);font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(255,92,0,.35)}
.won-price span{font-family:var(--f-disp);font-size:.35em;margin-left:.2em}
.bdr em{font-style:normal;font-family:var(--f-mono);font-weight:700;font-size:clamp(12px,calc(var(--u)*1),22px);color:var(--fg);font-variant-numeric:tabular-nums;min-height:1.4em}
.bdr.now{border-color:var(--or);background:rgba(255,92,0,.1)}
.bdr.now b,.bdr.now em{color:var(--or)}
.bdr.lead em::after{content:"  最高値";font-size:.7em;color:var(--or);letter-spacing:.1em}
.bdr.gone{opacity:.35}
.bdr.gone em::after{content:"  降りた";font-size:.7em;letter-spacing:.1em}
.speech{border-left:4px solid var(--or);padding:calc(var(--u)*.4) 0 calc(var(--u)*.4) calc(var(--u)*1.4);min-height:calc(var(--u)*7.5);display:flex;flex-direction:column;justify-content:center;gap:4px}
.speech .who{font-family:var(--f-disp);font-weight:900;font-size:clamp(13px,calc(var(--u)*1.1),24px);color:var(--or)}
.speech .say{font-family:var(--f-disp);font-weight:900;font-size:clamp(22px,calc(var(--u)*2.6),56px);line-height:1.4;margin:0;text-wrap:balance}
.speech.pop{animation:in .3s ease both}
.speech.out .say{color:var(--mute)}
.typing{font-family:var(--f-disp);font-weight:700;font-size:clamp(18px,calc(var(--u)*2),42px);line-height:1.6;margin:0;min-height:3.2em}
.cur{display:inline-block;width:.5em;height:1em;background:var(--or);vertical-align:-.12em;margin-left:2px;animation:blink 1s steps(2) infinite}

/* 落札証明書 */
.cert{border:2px solid var(--or);padding:calc(var(--u)*1.4) calc(var(--u)*1.6);display:grid;grid-template-columns:auto minmax(0,1fr);gap:calc(var(--u)*1) calc(var(--u)*1.8);position:relative;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
.cert .chead{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:calc(var(--u)*.6)}
.cert .ctitle{font-family:var(--f-disp);font-weight:900;font-size:clamp(16px,calc(var(--u)*1.5),32px)}
.cert .cph{position:relative;overflow:visible!important;width:clamp(110px,calc(var(--u)*14),300px);aspect-ratio:1;background:var(--or);overflow:hidden}
.cert .cph img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.15);mix-blend-mode:multiply}
.cert dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:calc(var(--u)*.4) 14px;align-content:start}
.cert dt{font-family:var(--f-mono);font-size:clamp(10px,calc(var(--u)*.7),15px);color:var(--mute);letter-spacing:.12em;padding-top:.35em}
.cert dd{margin:0;font-size:clamp(14px,calc(var(--u)*1.15),24px)}
.cert dd.p{font-family:var(--f-mono);font-weight:700;font-size:clamp(22px,calc(var(--u)*2.6),56px);line-height:1.1;color:var(--or)}
.cert .cq{grid-column:1/-1;margin:0;font-family:var(--f-disp);font-weight:900;font-size:clamp(18px,calc(var(--u)*2),42px);line-height:1.6;white-space:pre-line;border-left:3px solid var(--or);padding-left:calc(var(--u)*1.2)}
.cert .cfoot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:end;gap:16px;border-top:2px solid var(--or);padding-top:calc(var(--u)*.8)}
.cert .tagline{font-family:var(--f-disp);font-weight:900;font-size:clamp(16px,calc(var(--u)*1.6),34px);color:var(--or);line-height:1.4}
.qr{background:#fff;padding:4px;width:clamp(64px,calc(var(--u)*6.5),140px);aspect-ratio:1;flex:none}
.qr img,.qr canvas{width:100%!important;height:100%!important;display:block}
.stamp{position:absolute;right:-.3em;bottom:.4em;font-family:var(--f-disp);font-weight:900;font-size:clamp(26px,calc(var(--u)*3.4),70px);color:var(--or);border:3px solid var(--or);padding:0 .35em;transform:rotate(-8deg);animation:stampin .45s cubic-bezier(.2,1.6,.4,1) both .5s;background:var(--bk)}
@keyframes stampin{from{opacity:0;transform:rotate(-8deg) scale(1.9)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
.bar{height:3px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--or);width:100%;transform-origin:left}

/* 落札記録 */
.logrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;border-top:1px solid var(--line);padding-top:calc(var(--u)*.7)}
.loglist{display:flex;gap:8px;overflow:hidden;min-height:calc(var(--u)*5.6)}
.li{flex:0 0 auto;display:grid;grid-template-columns:auto auto;gap:0 8px;align-items:center;animation:in .4s ease both}
.li .t{width:calc(var(--u)*5.2);min-width:44px;aspect-ratio:1;background:var(--or);overflow:hidden}
.li .t img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.15);mix-blend-mode:multiply}
.li .m{display:flex;flex-direction:column;line-height:1.35;font-size:clamp(10px,calc(var(--u)*.72),15px);max-width:11em}
.li .m b{font-family:var(--f-mono);color:var(--or);font-variant-numeric:tabular-nums}
.li .m span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logempty{color:var(--mute);font-size:clamp(11px,calc(var(--u)*.8),17px);align-self:center}

.btn{font-family:var(--f-disp);font-weight:900;font-size:clamp(16px,calc(var(--u)*1.3),28px);border:0;cursor:pointer;padding:.7em 1.3em;background:var(--or);color:#000}

/* 全画面の競売：上に世界の見出し、中央に品物、まわりに住人3人 */
#arena{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 60%,#1a0d05 0%,var(--bk) 60%);display:grid;grid-template-rows:auto minmax(0,1fr);gap:calc(var(--u)*1);
  padding-block:calc(var(--u)*1.4) calc(var(--u)*1.6);padding-left:max(calc(var(--u)*3),env(safe-area-inset-left,0px));padding-right:max(calc(var(--u)*3),env(safe-area-inset-right,0px));animation:in .4s ease both}
#arena[hidden]{display:none}
.ahead{display:flex;justify-content:space-between;align-items:flex-end;gap:calc(var(--u)*2);border-bottom:2px solid var(--or);padding-bottom:calc(var(--u)*.8)}
.ahead h2{font-family:var(--f-disp);font-weight:900;font-size:clamp(22px,calc(var(--u)*3),64px);line-height:1.2;margin:0;color:var(--or)}
.ahead p{margin:0;font-size:clamp(12px,calc(var(--u)*1.25),28px);font-weight:700}
.abody{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:calc(var(--u)*.6) calc(var(--u)*1.5);min-height:0}
#gaze{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#gaze line{stroke:var(--or);stroke-width:2;stroke-dasharray:4 10;stroke-linecap:round;opacity:.7;animation:gz 1s linear infinite}
@keyframes gz{to{stroke-dashoffset:-14}}
.acenter{grid-column:2;grid-row:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.7);min-width:0;text-align:center}
.aphoto{width:calc(var(--u)*31);max-width:100%;aspect-ratio:3/2;border:2px solid var(--or);overflow:hidden;position:relative;transition:width .6s cubic-bezier(.6,0,.3,1);box-shadow:0 0 50px rgba(255,92,0,.25)}
.aphoto img{width:100%;height:100%;object-fit:cover;display:block}
.aphoto::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
#arena.bid .aphoto{width:calc(var(--u)*15)}
.aitem{font-family:var(--f-disp);font-weight:900;font-size:clamp(20px,calc(var(--u)*2.8),60px);line-height:1.3;margin:0;text-wrap:balance;transition:font-size .5s}
#arena.bid .aitem{font-size:clamp(15px,calc(var(--u)*1.6),34px)}
.acap{margin:0;font-family:var(--f-disp);font-weight:700;font-size:clamp(14px,calc(var(--u)*1.5),32px);line-height:1.5;min-height:1.5em;text-wrap:balance}
#arena.bid .acap{display:none}
.aprice{display:none;align-items:baseline;gap:.25em;justify-content:center}
#arena.bid .aprice{display:flex}
.aprice b{font-family:var(--f-mono);font-weight:700;font-size:clamp(36px,calc(var(--u)*5),110px);line-height:1;color:var(--or);font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(255,92,0,.35)}
.aprice span{font-family:var(--f-disp);font-weight:900;font-size:clamp(14px,calc(var(--u)*1.6),36px);color:var(--or)}
.aprice small{display:block}

.fig svg,.fig img{position:absolute;inset:0;width:100%;height:100%}

.seat .nm em{font-style:normal;font-family:var(--f-mono);font-weight:700;font-size:clamp(12px,calc(var(--u)*1.25),28px);min-height:1.4em;font-variant-numeric:tabular-nums}
.seat .nm em small{font-family:var(--f-disp);font-size:.6em;letter-spacing:.1em;margin-left:.6em}
.bub{position:relative;border:2px solid var(--or);background:var(--bk);padding:calc(var(--u)*.7) calc(var(--u)*1);font-family:var(--f-disp);font-weight:900;font-size:clamp(15px,calc(var(--u)*1.9),42px);line-height:1.4;text-align:left;max-width:100%;visibility:hidden;text-wrap:balance}
.seat.s2 .bub{position:absolute;left:calc(50% + var(--u)*11);top:50%;translate:0 -50%;max-width:calc(var(--u)*30);width:max-content}
.bub::after{content:"";position:absolute;left:50%;bottom:-11px;width:18px;height:18px;background:var(--bk);border-right:2px solid var(--or);border-bottom:2px solid var(--or);transform:translateX(-50%) rotate(45deg)}
.seat.s2 .bub::after{left:-11px;bottom:auto;top:50%;transform:translateY(-50%) rotate(135deg)}
.seat.now .bub{visibility:visible;animation:pop .3s cubic-bezier(.2,1.5,.4,1) both}
.seat.now .fig{transform:scale(1.1)}
.seat.now .fig svg{opacity:1;filter:drop-shadow(0 0 10px rgba(255,92,0,.7))}
.seat.now .nm b,.seat.lead .nm em{color:var(--or)}

#arena.bid .seat.wait{opacity:.35}

.seat.arrive .fig{animation:arrive2 .7s ease-out}
@keyframes arrive2{0%{filter:brightness(3)}100%{filter:none}}
.icard.withfig{display:grid;grid-template-columns:auto minmax(0,1fr);gap:calc(var(--u)*.4) calc(var(--u)*2);align-items:center}
.icard.withfig .fig{grid-row:1/4;height:calc(var(--u)*15);aspect-ratio:3/4;position:relative}

/* 落札グリッド（Gキー、または ?grid で表示） */
#grid{position:fixed;inset:0;z-index:30;background:#eef0f3;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:1px;color:#0b0b0c;font-family:"Melete","Michroma","JetBrains Mono",sans-serif}

.gc{position:relative;overflow:hidden;background:#f6f7f9;min-width:0;min-height:0}

  background:linear-gradient(180deg,rgba(246,247,249,.94) 0,rgba(246,247,249,.72) 17%,rgba(246,247,249,0) 34%,rgba(246,247,249,0) 62%,rgba(246,247,249,.8) 86%,rgba(246,247,249,.95) 100%),
  radial-gradient(ellipse at center,rgba(246,247,249,0) 45%,rgba(246,247,249,.55) 100%)}
.gc .dots{position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(11,11,12,.16) .6px,transparent .7px);background-size:5px 5px;mix-blend-mode:multiply}
.gc .top{position:absolute;left:7%;right:5%;top:9%;display:flex;align-items:center;justify-content:space-between;gap:4%}

.gc .pr{display:flex;align-items:baseline;gap:.35em;font-size:clamp(14px,calc(var(--u)*2.05),46px);letter-spacing:.08em;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}

.gc .pr s{text-decoration:none;font-size:.55em;margin-left:.9em;font-family:var(--f-mono);font-weight:400}

.gc .who{position:relative;padding-left:0;line-height:1.5;min-width:0}
.gc .who::before{content:"";position:absolute;left:-.2em;top:-1.5em;width:1px;height:1.6em;background:#0b0b0c;transform:rotate(38deg);transform-origin:bottom left;opacity:.6}
.gc .who small{display:block;font-size:clamp(7px,calc(var(--u)*.56),13px);letter-spacing:.14em;opacity:.6}
.gc .who b{display:block;font-weight:400;font-size:clamp(9px,calc(var(--u)*.78),18px);letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .hatch{flex:none;width:calc(var(--u)*2.2);height:calc(var(--u)*.6);min-height:6px;opacity:.5;transform:skewX(-28deg);background:repeating-linear-gradient(90deg,#0b0b0c 0 2px,transparent 2px calc(var(--u)*.5))}
.gc .lotn{position:absolute;right:5%;top:50%;transform:translateY(-50%) rotate(90deg);transform-origin:right center;font-family:var(--f-mono);font-size:clamp(7px,calc(var(--u)*.5),11px);letter-spacing:.2em;opacity:.35;white-space:nowrap}
.gc.empty .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em;opacity:.28}

@keyframes gnew{0%{filter:invert(1)}12%{filter:none;transform:translateX(-6px)}24%{filter:invert(1);transform:translateX(5px)}36%{filter:none;transform:none}48%{filter:contrast(1.6)}60%{filter:none}}
.gscan{position:absolute;left:0;right:0;height:1px;background:rgba(11,11,12,.25);animation:gscan 7s linear infinite;pointer-events:none;z-index:2}
@keyframes gscan{from{top:-1%}to{top:101%}}

/* 背景・HUD・グリッチ */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.hud{position:fixed;z-index:0;pointer-events:none;font-family:var(--f-mono);font-size:clamp(10px,calc(var(--u)*.62),14px);line-height:1.6;letter-spacing:.08em;color:var(--or);opacity:.4;font-variant-numeric:tabular-nums;white-space:pre}

  60%{transform:translate(2px,-1px);clip-path:inset(0 0 70% 0);opacity:1}
  100%{transform:none;text-shadow:none;clip-path:none;opacity:1}}
.wrap.pg{animation:pg .32s steps(1) both}
@keyframes pg{0%{transform:none}20%{transform:translate(-6px,0) skewX(-2deg)}40%{transform:translate(5px,2px);filter:contrast(1.4)}60%{transform:translate(-2px,-1px);opacity:.8}80%{transform:translate(3px,0)}100%{transform:none;filter:none;opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(1.5) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{from{top:8%}to{top:92%}}
@keyframes blink{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}.flash{display:none}}

/* 縦長・狭い画面（スマホ確認用） */

<body>

</div>

<script>
const $=s=>document.querySelector(s);
const CFG=Object.assign({minSec:8,maxSec:28,lockSec:3,certSec:14,qrUrl:""},window.AUCTION||{});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>Math.round(Number(n)||0).toLocaleString("ja-JP");
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* 競売が開かれる世界（GAS側にも同じ設定がある）。誰もが知っている物語のお約束でできている */
const CITIES={
  island:{name:"無人島サバイバル",code:"SOS / DAY 1095",unit:"円",rule:"船が難破して流れついた島。3年たっても助けが来ない。火・水・刃物になる物が何より大事。",
    residents:[["漂流3年目の元会社員","島暮らしに慣れてきた","CASTAWAY SALARYMAN"],["救助を待つ船長","合図に使える物がほしい","THE STRANDED CAPTAIN"],["島のサル","光る物が大好き","ISLAND MONKEY"]]},
  ninja:{name:"忍者の里",code:"SHINOBI",unit:"円",rule:"山奥に隠れた忍者の里。音を立てない物、隠せる物、投げられる物ほど役に立つ。",
    residents:[["見習い忍者","早く一人前になりたい","NINJA TRAINEE"],["くノ一","変装の道具を探している","THE KUNOICHI"],["里の長老","里の宝を集めている","VILLAGE ELDER"]]},
  zombie:{name:"ゾンビがあふれた世界",code:"SURVIVORS: 37",unit:"円",rule:"町はゾンビだらけ。生き残った人はショッピングモールに立てこもっている。長持ちする物、音が出ない物が大事。",
    residents:[["モールのリーダー","みんなを守る物がほしい","MALL LEADER"],["物資の調達係","外に出る役。身を守りたい","THE SCAVENGER"],["元ホームセンター店員","道具の使い方にうるさい","HARDWARE CLERK"]]},
  kaiju:{name:"怪獣が毎週来る街",code:"KAIJU / WEEKLY",unit:"円",rule:"毎週日曜に怪獣が現れて街を壊していく。丈夫な物、すぐ持って逃げられる物ほど値打ちがある。",
    residents:[["防衛隊の新人隊員","怪獣にまだ一度も勝てていない","DEFENSE ROOKIE"],["怪獣保険の営業マン","壊れない物に目がない","KAIJU INSURER"],["商店街の会長","毎週お店を建て直している","MARKET CHAIRMAN"]]},
  robot:{name:"巨大ロボットがある世界",code:"UNIT-01 / 18m",unit:"円",rule:"身長18メートルの巨大ロボットが街を守っている。人間の小さな道具は、ロボの部品やお守りとして重宝される。",
    residents:[["ロボの整備士","細かい部品が足りない","MECH ENGINEER"],["新人パイロット","操縦席でお守りがほしい","ROOKIE PILOT"],["基地の食堂のおばちゃん","隊員みんなのお母さん役","CANTEEN MAMA"]]},
  edo:{name:"江戸時代",code:"EDO / 1825",unit:"円",rule:"電気もプラスチックもない江戸の町。今の道具は、見たことのない不思議な品に見える。",
    residents:[["長屋の大工","便利な道具に目がない","EDO CARPENTER"],["呉服屋の若旦那","珍しい品で客を呼びたい","KIMONO HEIR"],["浮世絵師","新しい題材を探している","UKIYO-E PAINTER"]]}
};
const CITY_KEYS=Object.keys(CITIES);

/* GAS未設定時の模擬鑑定（写真の中身は読めないので「持ち主不明の品」として競る） */
const MOCK={
  island:{item:"持ち主不明の品",appraisal:"この島では、何かの道具になりそうな物は全部宝物。",
    bids:[["島のサル","キーキー！（バナナ3本分）",300],["救助を待つ船長","光らせて合図に使える。3,000円。",3000],["漂流3年目の元会社員","魚とりに使える！8,000円！",8000],["救助を待つ船長","…船長として12,000円。",12000],["漂流3年目の元会社員","3年ぶりの新品だ。20,000円！",20000]],
    winner:"漂流3年目の元会社員",use:"魚をとる道具に作り変えて、毎日のごはんにする。",quote:"3年ぶりに\n新しい物をさわった"},
  ninja:{item:"持ち主不明の品",appraisal:"この里では、隠して持ち歩ける物ほど値打ちがある。",
    bids:[["見習い忍者","修行に使いたい！2,000円！",2000],["くノ一","変装の小道具にいい。6,000円。",6000],["里の長老","これは南蛮渡来の忍具じゃ。10,000円。",10000],["見習い忍者","…おこづかいが足りない。降ります。",10000],["くノ一","15,000円。長老には渡さない。",15000]],
    winner:"くノ一",use:"着物の袖にしのばせて、変装の仕上げに使う。",quote:"これで、どんな人にも\n化けられる気がする"},
  zombie:{item:"持ち主不明の品",appraisal:"この世界では、音を立てずに使える物ほど値打ちがある。",
    bids:[["物資の調達係","外に出るとき持っていきたい。3,000円。",3000],["元ホームセンター店員","使い方なら私が一番わかる。7,000円。",7000],["モールのリーダー","みんなのために12,000円。",12000],["物資の調達係","命がかかってる。18,000円！",18000]],
    winner:"物資の調達係",use:"リュックの一番取り出しやすい場所に入れておく。",quote:"これがあれば、\n今日も帰ってこられる"},
  kaiju:{item:"持ち主不明の品",appraisal:"この街では、怪獣が来てもこわれない物ほど値打ちがある。",
    bids:[["商店街の会長","今週こそ守りたい。2,000円。",2000],["怪獣保険の営業マン","丈夫そうだ。保険の見本に8,000円。",8000],["防衛隊の新人隊員","怪獣に勝つためなら10,000円！",10000],["商店街の会長","店の看板にする。15,000円！",15000]],
    winner:"商店街の会長",use:"店の入り口に飾って、怪獣よけのお守りにする。",quote:"今週の日曜は、\n店がこわれませんように"},
  robot:{item:"持ち主不明の品",appraisal:"この世界では、ロボのお守りになる小さな物ほど値打ちがある。",
    bids:[["ロボの整備士","部品に使えそう。3,000円。",3000],["基地の食堂のおばちゃん","みんなの元気が出そうね。5,000円。",5000],["新人パイロット","操縦席に置きたい！9,000円！",9000],["ロボの整備士","…パイロットに使ってもらおう。降りる。",9000]],
    winner:"新人パイロット",use:"操縦席の前に置いて、出撃のたびに軽くさわる。",quote:"18メートルのロボより、\nこれのほうが心強い"},
  edo:{item:"持ち主不明の品",appraisal:"江戸では、見たこともない素材でできた物は珍品。",
    bids:[["長屋の大工","こりゃ便利そうだ。2,000円。",2000],["浮世絵師","絵にしたら売れる！6,000円！",6000],["呉服屋の若旦那","店先に飾れば客が来る。12,000円。",12000],["浮世絵師","…絵の具代が足りない。降ります。",12000]],
    winner:"呉服屋の若旦那",use:"店先に飾って「南蛮渡来の珍品」として客を呼ぶ。",quote:"江戸中の客が\nうちに来るぞ"}
};

/* ===== 状態 ===== */
const S={phase:"boot",stream:null,city:pick(CITY_KEYS),nextAt:0,lot:1,timer:null,busy:false};
try{S.lot=Number(localStorage.getItem("ikai_lot")||"1")||1}catch{}
const stage=$("#stage"),cam=$("#cam"),video=$("#v"),freeze=$("#freeze");
function setLot(){$("#lotno").textContent="LOT "+String(S.lot).padStart(4,"0")}
function setMode(t){$("#mode").textContent=t}
function glitch(el){if(!el)return;el.classList.remove("gl");void el.offsetWidth;el.classList.add("gl")}
function pageGlitch(){const w=$("#wrap"),st=$("#static");w.classList.remove("pg");st.classList.remove("on");void w.offsetWidth;w.classList.add("pg");st.classList.add("on");SND.static()}

/* ===== カメラ：ページを開いた瞬間に起動 ===== */
async function startCam(){
  const nc=$("#nocam");nc.hidden=true;
  if(!navigator.mediaDevices?.getUserMedia){nc.hidden=false;nc.innerHTML="このブラウザではカメラを使えません。<br>HTTPS（GitHub Pages など）で開いてください。";return false}
  try{
    S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280},height:{ideal:960}},audio:false});
    video.srcObject=S.stream;await video.play().catch(()=>{});
    return true;

function idle(){

}
function restartAnim(){stage.style.animation="none";void stage.offsetHeight;stage.style.animation=""}
function schedule(){
  clearTimeout(S.timer);
  if(gridOpen())return;   // グリッドを見ている間は撮らない
  const wait=rnd(CFG.minSec,CFG.maxSec)*1000;
  S.nextAt=performance.now()+wait;
  S.timer=setTimeout(lockOn,Math.max(0,wait-CFG.lockSec*1000));
}
async function lockOn(){
  if(S.phase!=="watch"||!S.stream)return schedule();
  S.phase="lock";cam.classList.add("lock");setMode("◎ TARGET LOCK");
  for(let i=0;i<CFG.lockSec;i++){if(gridOpen())break;SND.beep(i);await sleep(1000)}
  if(gridOpen()){S.phase="watch";cam.classList.remove("lock");setMode("● LIVE · 監視中");return}
  shoot();
}

/* ===== シャッター → 強制出品 ===== */
async function shoot(){
  if(S.busy)return;S.busy=true;clearTimeout(S.timer);
  const vw=video.videoWidth,vh=video.videoHeight;
  if(!vw){S.busy=false;S.phase="watch";cam.classList.remove("lock");return schedule()}
  const w=960,h=Math.round(w*vh/vw);
  freeze.width=w;freeze.height=h;const fx=freeze.getContext("2d");fx.drawImage(video,0,0,w,h);
  // 真っ暗（レンズがふさがれている）なら見送る
  const px=fx.getImageData(0,0,w,h).data;let sum=0;for(let i=0;i<px.length;i+=4*97)sum+=px[i]+px[i+1]+px[i+2];
  if(sum/(px.length/(4*97))/3<14){S.busy=false;S.phase="watch";cam.classList.remove("lock");return schedule()}
  const jpeg=freeze.toDataURL("image/jpeg",.82);
  const thumb=square(freeze,360);S.photo=crop32(freeze,720);
  S.phase="seized";cam.classList.remove("lock");cam.classList.add("seized");
  const f=document.createElement("div");f.className="flash";document.body.append(f);setTimeout(()=>f.remove(),800);
  SND.shutter();setMode("■ SEIZED · 出品手続き中");
  await sleep(700);pageGlitch();
  await runAuction(jpeg.split(",")[1],thumb);
}
function crop32(src,w){const h=Math.round(w*2/3);let sw=src.width,sh=Math.round(sw*2/3);if(sh>src.height){sh=src.height;sw=Math.round(sh*1.5)}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(src,(src.width-sw)/2,(src.height-sh)/2,sw,sh,0,0,w,h);return c.toDataURL("image/jpeg",.8)}
function square(src,size){const s=Math.min(src.width,src.height);const c=document.createElement("canvas");c.width=c.height=size;c.getContext("2d").drawImage(src,(src.width-s)/2,(src.height-s)/2,s,s,0,0,size,size);return c.toDataURL("image/jpeg",.75)}

/* ===== 鑑定（GAS経由でClaude、なければ模擬） ===== */
async function appraise(image){
  if(window.GAS_URL){
    const r=await fetch(window.GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({mode:"auction",city:S.city,image})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||"server_error");
    return normalize(d.result);
  }
  await sleep(rnd(2500,4500));
  const m=structuredClone(MOCK[S.city]);
  return normalize({...m,bids:m.bids.map(([who,line,price])=>({who,line,price}))});
}
function normalize(d){
  if(!d||!Array.isArray(d.bids)||!d.bids.length)throw new Error("invalid");
  let last=0;
  d.bids=d.bids.slice(0,7).map(b=>{const p=Math.max(last,Number(b.price)||0);const out=p===last&&last>0;last=p;return{who:String(b.who||"住人"),line:String(b.line||""),price:p,out}});
  d.price=Number(d.price)||last;if(d.price<last)d.price=last;
  d.winner=String(d.winner||[...d.bids].reverse().find(b=>!b.out)?.who||d.bids[0].who);
  for(const k of["item","appraisal","use","quote"])d[k]=String(d[k]||"");
  return d;
}

/* ===== 背景：計器の方眼＋走査線 ===== */
(function(){
  const cv=$("#bg"),ctx=cv.getContext("2d");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W,H;
  function size(){const dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  size();addEventListener("resize",size);
  const G=48,t0=performance.now();
  function frame(now){
    const t=(now-t0)/1000;ctx.clearRect(0,0,W,H);ctx.lineWidth=1;
    ctx.strokeStyle="rgba(255,92,0,.06)";ctx.beginPath();
    for(let x=(W/2)%G;x<W;x+=G){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H)}
    for(let y=(H/2)%G;y<H;y+=G){ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5)}
    ctx.stroke();
    ctx.strokeStyle="rgba(255,92,0,.2)";ctx.beginPath();
    for(let x=(W/2)%G;x<W;x+=G)for(let y=(H/2)%G;y<H;y+=G){ctx.moveTo(x-3,y+.5);ctx.lineTo(x+4,y+.5);ctx.moveTo(x+.5,y-3);ctx.lineTo(x+.5,y+4)}
    ctx.stroke();
    if(!reduce){
      const sp=S.phase==="lock"?1.2:6;
      const y=((t/sp)%1)*(H+160)-80;
      const g=ctx.createLinearGradient(0,y-120,0,y);g.addColorStop(0,"rgba(255,92,0,0)");g.addColorStop(1,`rgba(255,92,0,${S.phase==="lock"?.18:.09})`);
      ctx.fillStyle=g;ctx.fillRect(0,y-120,W,120);ctx.fillStyle="rgba(255,92,0,.5)";ctx.fillRect(0,y,W,1);
      if((t%4)<.12){ctx.fillStyle="rgba(255,92,0,.06)";ctx.fillRect(0,(Math.sin(t*13)*.5+.5)*H,W,2+Math.random()*6)}
      requestAnimationFrame(frame);
    }
  }
  requestAnimationFrame(frame);
})();

const SND=(()=>{

    loop();
  }
  /* 世界ごとの曲。step(k,c) が1拍ぶんの音を鳴らす（k＝拍の番号、c＝その小節の和音） */
  const pk=a=>a[Math.floor(Math.random()*a.length)];
  const MUS={
    // 無人島：ウクレレ風ののんびりした曲と波の音
    island:{ms:150,ch:[[261.6,329.6,392,523.3],[220,261.6,329.6,440],[174.6,220,261.6,349.2],[196,246.9,293.7,392]],step(k,c){const s=k%8;
      if([0,3,4,6].includes(s))c.forEach((f,i)=>tone(f*2,.35,{type:"triangle",vol:s===0?.035:.02,at:i*.018,bus:bgm}));
      if(s===0)tone(c[0]/2,.4,{vol:.12,bus:bgm});if(s===4)tone(c[2]/2,.3,{vol:.08,bus:bgm});
      if(k%32===0)noise(2.6,{vol:.03,f:500,q:.3,type:"lowpass"});
      if(s===2&&Math.random()<.4)tone(pk([784,880,1046.5,1174.7]),.5,{vol:.03,bus:bgm})}},
    // 忍者の里：琴と和太鼓風。音の間を大きく取る
    ninja:{ms:170,step(k){const s=k%16,sc=[293.7,311.1,392,440,466.2,587.3];
      if([0,3,6,8,11,14].includes(s)&&Math.random()<.8)tone(pk(sc)*(Math.random()<.3?.5:1),.7,{type:"sawtooth",vol:.028,bus:bgm});
      if(s===0||s===10){tone(95,.35,{vol:.22,slide:48});noise(.06,{vol:.05,f:300,type:"lowpass"})}
      if(k%32===16){const f=pk([587.3,440,466.2]);tone(f,2.2,{vol:.03,slide:f*.97,bus:bgm})}}},
    // ゾンビ：不気味だけどコミカルなワルツ
    zombie:{ms:190,bar:6,ch:[[110,220,261.6,329.6],[110,220,261.6,329.6],[146.8,220,293.7,349.2],[164.8,207.7,246.9,329.6]],step(k,c){const s=k%6;
      if(s===0)tone(c[0],.45,{type:"triangle",vol:.14,bus:bgm});
      if(s===2||s===4)c.slice(1).forEach(f=>tone(f,.18,{type:"square",vol:.014,bus:bgm}));
      if(s===0&&Math.floor(k/6)%2===0){const f=pk([440,523.3,622.3,659.3,880]);tone(f,1.0,{vol:.035,slide:f*1.06,bus:bgm})}}},
    // 怪獣：特撮映画風の重い行進曲
    kaiju:{ms:160,step(k){const s=k%4,b=Math.floor(k/4)%8,f=[82.4,82.4,87.3,82.4,82.4,82.4,98,92.5][b];
      if(s===0){tone(f,.5,{type:"sawtooth",vol:.045,bus:bgm});tone(f*2,.5,{type:"sawtooth",vol:.025,bus:bgm});if(b%2===0)tone(70,.5,{vol:.24,slide:45})}
      if(s===2)noise(.08,{vol:.04,f:2500});if(s===3)noise(.05,{vol:.025,f:2500});
      if(k%32===24)[329.6,392,493.9].forEach((x,i)=>tone(x,.5,{type:"sawtooth",vol:.022,at:i*.16,bus:bgm}))}},
    // 巨大ロボ：シンセのヒーローもの主題歌風
    robot:{ms:125,ch:[[174.6,220,261.6],[196,246.9,293.7],[220,261.6,329.6],[220,261.6,329.6]],step(k,c){const s=k%16;
      if(k%4===0)tone(130,.25,{vol:.2,slide:45});
      if(k%2===0)tone(c[0]/2,.14,{type:"square",vol:.03,bus:bgm});
      tone(c[k%3]*2,.1,{type:"square",vol:.014,bus:bgm});
      if(k%4===2)noise(.03,{vol:.012,f:8000,type:"highpass"});
      if(s===0)tone(c[2]*4,.9,{type:"triangle",vol:.04,bus:bgm});if(s===12)tone(c[1]*4,.4,{type:"triangle",vol:.035,bus:bgm})}},
    // 江戸：三味線と祭囃子風
    edo:{ms:165,step(k){const s=k%16,sc=[293.7,329.6,392,440,493.9,587.3];
      if([0,2,3,6,8,10,11,14].includes(s)){const f=pk(sc);tone(f,.22,{type:"square",vol:.028,slide:f*.98,bus:bgm})}
      if([0,3,4,6].includes(k%8)){tone(2093,.08,{vol:.018});tone(3136,.06,{vol:.01})}
      if(k%8===0||k%8===5)tone(100,.3,{vol:.2,slide:50});
      if(k%32===8)tone(pk([880,987.8,1174.7]),1.6,{vol:.03,bus:bgm})}}
  };
  let world="island",beat=0;
  function loop(){const m=MUS[world];
    if(on&&ac.state==="running"){m.step(beat,m.ch?m.ch[Math.floor(beat/(m.bar||16))%m.ch.length]:null);beat++}
    arp=setTimeout(loop,m.ms)}
  function tone(freq,dur,{type="sine",vol=.3,at=0,slide=0,bus=master}={}){
    if(!ac||!on)return;const t=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.05);
  }
  function noise(dur,{vol=.3,f=2000,q=1,type="bandpass",at=0}={}){
    if(!ac||!on)return;const t=ac.currentTime+at,b=ac.createBuffer(1,ac.sampleRate*(dur+.1),ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const n=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();n.buffer=b;fl.type=type;fl.frequency.value=f;fl.Q.value=q;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);n.connect(fl);fl.connect(g);g.connect(master);n.start(t);n.stop(t+dur+.05);
  }
  function start(){init();ac.resume();bgm.gain.setTargetAtTime(on?1:0,ac.currentTime,1.2)}
  btn.onclick=()=>{on=!on;try{localStorage.setItem("ikai_sound",on?"on":"off")}catch{}ui();if(on)start();else if(ac)bgm.gain.setTargetAtTime(0,ac.currentTime,.2)};
  ui();
  // 音はブラウザの仕様上、最初の操作のあとに鳴る（会場ではスタッフが一度画面に触れる）
  addEventListener("pointerdown",()=>{if(on)start()},{once:true});
  addEventListener("keydown",()=>{if(on)start()},{once:true});
  return{
    beep(i){tone(1320+i*220,.12,{type:"square",vol:.07})},
    shutter(){noise(.14,{vol:.55,f:3000,q:.7,type:"highpass"});tone(1600,.05,{type:"square",vol:.12});tone(110,.6,{vol:.2,slide:55,at:.05})},
    static(){noise(.22,{vol:.06,f:2600,q:.6});tone(60,.15,{type:"square",vol:.03})},
    type(){tone(1700+Math.random()*500,.025,{type:"square",vol:.012})},
    bid(i){tone(660+i*60,.12,{type:"triangle",vol:.08});tone(990+i*90,.18,{type:"triangle",vol:.06,at:.08})},
    out(){tone(392,.3,{type:"triangle",vol:.06,slide:330})},
    hammer(){tone(90,.3,{vol:.55,slide:45});noise(.12,{vol:.45,f:900,q:.8});tone(90,.3,{vol:.45,slide:45,at:.32});noise(.12,{vol:.35,f:900,q:.8,at:.32})},
    stamp(){[523.3,659.3,784,1046.5].forEach((f,i)=>tone(f,.5,{type:"triangle",vol:.08,at:i*.1}))},
    intro(){[392,523.3,659.3].forEach((f,i)=>tone(f,.35,{type:"triangle",vol:.07,at:i*.07}));noise(.2,{vol:.05,f:4000,q:.5})},
    world(w){if(MUS[w]&&w!==world){world=w;beat=0}},
    error(){tone(330,.25,{type:"sawtooth",vol:.1,slide:165});tone(220,.4,{type:"sawtooth",vol:.1,at:.22,slide:110})}
  };
})();

/* ===== 落札グリッド：最新9件を、写真＋落札額＋落札者（英語名）＋ロゴで並べる ===== */
const GRID_ONLY=new URLSearchParams(location.search).has("grid");
let LOTS=[];try{LOTS=JSON.parse(localStorage.getItem("ikai_lots")||"[]")}catch{}
function enName(c,winner){const r=c.residents.find(r=>r[0]===winner);return r&&r[2]?r[2]:String(winner).toUpperCase()}
function addLot(d,c,lot){
  LOTS.unshift({lot,photo:S.photo||"",price:d.price,winner:enName(c,d.winner),t:Date.now()});
  LOTS=LOTS.slice(0,9);
  try{localStorage.setItem("ikai_lots",JSON.stringify(LOTS))}catch{try{LOTS.slice(5).forEach(l=>l.photo="");localStorage.setItem("ikai_lots",JSON.stringify(LOTS))}catch{}}
  renderGrid(LOTS[0].t);
}
function renderGrid(newT){
  const g=$("#grid");let h='<div class="gscan"></div>';
  for(let i=0;i<9;i++){const l=LOTS[i];
    if(!l){h+=`<div class="gc empty"><div class="mid"><img class="logo" src="mvmnt-logo.png" alt="MVMNT"><span>AWAITING LOT</span></div></div>`;continue}
    h+=`<div class="gc${l.t===newT?" new":""}">${l.photo?`<img class="ph" alt="" src="${l.photo}">`:""}<div class="veil"></div><div class="dots"></div>
      <div class="top"><img class="logo" src="mvmnt-logo.png" alt="MVMNT"><div class="pr">${fmt(l.price)}<i>YEN</i></div></div>
      <div class="lotn">LOT ${esc(l.lot)}</div>
      <div class="bot"><div class="who"><small>SOLD TO</small><b>${esc(l.winner)}</b></div><div class="hatch"></div></div></div>`}
  g.innerHTML=h;
}
function gridOpen(){return !$("#grid").hidden}
function toggleGrid(on){
  const g=$("#grid");g.hidden=on===undefined?!g.hidden:!on;
  if(!g.hidden){renderGrid();clearTimeout(S.timer)}        // 開いたら自動撮影を止める
  else if(S.phase==="watch"&&S.stream)schedule();          // 閉じたら再開
}
addEventListener("storage",e=>{if(e.key==="ikai_lots"){try{LOTS=JSON.parse(e.newValue||"[]")}catch{}renderGrid(LOTS[0]?.t)}});

/* スタッフ用キー：Space＝今すぐ撮る、F＝全画面、G＝落札グリッド */
addEventListener("keydown",e=>{
  if(e.code==="Space"&&S.phase==="watch"){e.preventDefault();clearTimeout(S.timer);S.nextAt=performance.now()+CFG.lockSec*1000;lockOn()}
  if(e.key==="g"||e.key==="G")toggleGrid();
  if(e.key==="f"||e.key==="F"){document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.().catch(()=>{})}
});

/* 起動：ページを開いた瞬間からカメラが回る */
(async()=>{
  if(GRID_ONLY){toggleGrid(true);return}   // ?grid：2台目のモニター用。カメラは起動せず、グリッドだけ表示
  setLot();
  stage.innerHTML=`<div class="lbl alert">BOOT · CAM-01</div><h1 class="idle-h">監視カメラを<br><em>起動しています。</em></h1>`;
  if(await startCam())idle();
  else stage.innerHTML=`<div class="lbl alert">NO SIGNAL</div><h1 class="idle-h">カメラが<br>見つかりません。</h1><p class="idle-sub">左の画面からカメラを許可すると、競売が始まります。</p>`;
})();
</script>
